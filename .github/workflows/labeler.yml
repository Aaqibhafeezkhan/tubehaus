name: Labeler

# Labels pull requests by the files they touch (.github/labeler.yml).
# pull_request_target so it can label PRs from forks; it never checks out their code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
